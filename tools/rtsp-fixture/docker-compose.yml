name: edge-sec-fixture

services:
  mediamtx:
    image: bluenviron/mediamtx:1.13.0
    container_name: edge-sec-mediamtx
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: edge-sec-mosquitto
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
