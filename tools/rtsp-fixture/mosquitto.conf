# Test broker for the detector fixture. Port 1884 keeps it clear of any
# production broker already listening on 1883 on the same host.
listener 1884
allow_anonymous true
persistence false
log_dest stdout
# Snapshots are raw JPEG up to 200 KB; the default cap is far larger, but state
# it so the limit is visible next to the contract.
max_packet_size 1048576
