[project]
name = "esk-rknn"
version = "0.1.0"
description = "RK3588 RKNN person detector publishing sensecraft.detection/1"
requires-python = ">=3.10"
# rknn-toolkit-lite2 and PyGObject are NOT listed: both must come from the
# board (the RKNN user library has to match the kernel NPU driver, and the
# GStreamer bindings have to match the system GStreamer). The venv is created
# with --system-site-packages so they resolve from the OS, and pinning them
# here would install a second, mismatched copy.
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "paho-mqtt>=1.6,<2.0",
    "pyyaml>=6.0",
]

[project.scripts]
esk-rknn = "esk_rknn.__main__:main"

[dependency-groups]
dev = [
    "jsonschema>=4.21",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esk_rknn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
