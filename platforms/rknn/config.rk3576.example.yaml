# RK3576 RKNN detector configuration. Copy to config/config.yaml and edit.
#
# Same code as the RK3588 configuration next to this file -- the only
# per-chip settings are the model file and the identity. Everything else is
# shared, because RK3576 and RK3588 are both RKNPU2 and negotiate the same
# 640x360 MPP/RGA output for a 1280x720 source.
device_id: rk3576-01
stream_id: cam-0

# RTSP URL. Use a non-square source: a square one passes even when the
# letterbox inverse is missing entirely.
source: rtsp://127.0.0.1:8556/edge-sec-truth
rtsp_transport: tcp
rtsp_latency_ms: 100

# This platform decodes on the Rockchip MPP hardware decoder.
decode_primary: hw
# Refuse to start on the CPU decoder. The silent fallback is THE Rockchip
# failure mode: everything keeps working, slower, and the resulting frame gaps
# surface as duplicate alerts that look like a hub rule bug. Set false only if
# a degraded stream really is better than none.
require_hw_decode: true

# int8 by default: 23.9 ms in-pipeline inference against fp16's 48.6 ms, NPU
# load 5-6% against 9-10%, measured on a LubanCat RK3576 at 1280x720 / 5 fps.
# The end-to-end rule assertions pass identically. int8's failure mode is extra
# low-confidence boxes rather than misses, so raise conf_threshold before
# reaching for fp16. Roll back with models/yolov8n_zoo_fp16.rk3576.rknn.
model: models/yolov8n_zoo_int8.rk3576.rknn
input_size: 640
conf_threshold: 0.35
iou_threshold: 0.45
# null lets the RKNN runtime schedule. RK3576 has two NPU cores and, like
# RK3588's three, only Core0 is ever busy for a single small model -- multi-core
# is for running several models at once, not for splitting one.
npu_core_mask: null

track_iou_threshold: 0.2
track_max_lost_s: 0.75

mqtt_host: 127.0.0.1
mqtt_port: 1883
topic_prefix: sensecraft/security
status_interval_s: 30

preview_enabled: true
preview_bind: 0.0.0.0
preview_port: 8099
# Address a browser can actually reach. Left empty, preview_url and live_url
# are omitted rather than advertised wrongly.
preview_advertise_host: ""
