[project]
name = "esk-generic"
version = "0.1.0"
description = "Generic CPU/ONNX person detector publishing sensecraft.detection/1"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
    "paho-mqtt>=1.6,<2.0",
    "pyyaml>=6.0",
]

[project.scripts]
esk-generic = "esk_generic.__main__:main"

[dependency-groups]
dev = [
    "jsonschema>=4.21",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esk_generic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
