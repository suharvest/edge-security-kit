[project]
name = "edge-security-hub"
version = "0.1.0"
description = "Aggregation hub for edge-security-kit: MQTT ingest, rule engine, alert lifecycle, REST/WS API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiomqtt>=2.0",
    "bcrypt>=4.0",
    "jsonschema>=4.20",
]

[project.scripts]
edge-security-hub = "edge_hub.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
